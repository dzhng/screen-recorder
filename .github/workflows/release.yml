name: Tagged release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to validate and package; published assets remain unchanged
        required: true
        type: string
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      YAP_RELEASE_BUILD: "1"
      YAP_RELEASE_IDENTITY_P12: ${{ secrets.YAP_RELEASE_IDENTITY_P12 }}
      YAP_RELEASE_IDENTITY_PASSWORD: ${{ secrets.YAP_RELEASE_IDENTITY_PASSWORD }}
      YAP_SPARKLE_PRIVATE_KEY: ${{ secrets.YAP_SPARKLE_PRIVATE_KEY }}
      YAP_RELEASE_IDENTITY_SHA1: ${{ vars.YAP_RELEASE_IDENTITY_SHA1 }}
      YAP_RELEASE_CERTIFICATE_SHA256: ${{ vars.YAP_RELEASE_CERTIFICATE_SHA256 }}
      YAP_SPARKLE_PUBLIC_KEY: ${{ vars.YAP_SPARKLE_PUBLIC_KEY }}
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            apps
            packages
            helpers
            scripts
            .github
            specs/done/agent-editing/assets/00-corpus
      - id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Validate tag and release contracts
        run: |
          node scripts/release.mjs validate "$RELEASE_TAG"
          node --input-type=module -e 'import { releaseSigningInputs } from "./scripts/release-signing.mjs"; releaseSigningInputs();'
          node --test scripts/release.test.mjs apps/macos/tests/bundled-runtime.test.mjs
      - name: Prepare pinned build inputs
        run: node scripts/release.mjs prepare
      - name: Check native updater boundary
        run: node --test apps/macos/tests/update-sparkle.test.mjs apps/macos/tests/update-coordinator.test.mjs
      - name: Build app and its dependencies
        run: |
          bun install --frozen-lockfile
          bunx turbo run build --filter=@yap/macos --concurrency=1
      - name: Package and verify relocated release
        run: |
          node scripts/release.mjs package "$RELEASE_TAG"
          node scripts/release-smoke.mjs
          node scripts/release-media-smoke.mjs
          cp scripts/release-notes.md dist/release/NOTES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: |
            dist/release/*.zip
            dist/release/appcast.xml
            scripts/release-publish.mjs
            dist/release/SHA256SUMS
            dist/release/release.json
            dist/release/NOTES.md
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: release
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ needs.build.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          cd release/dist/release
          node ../../scripts/release-publish.mjs . "$RELEASE_TAG" "$RELEASE_COMMIT"
