name: Release contract checks
on:
  pull_request:
    paths:
      - .github/workflows/**
      - .node-version
      - helpers/denoise/provenance.json
      - scripts/release*
      - scripts/build-macos.mjs
      - scripts/launcher/**
      - scripts/launcher.test.mjs
      - scripts/sparkle/**
      - packages/core/src/catalog.ts
      - apps/macos/package.json
      - apps/macos/Sources/Yap/ServiceBundle.swift
      - apps/macos/Sources/Yap/NodeRuntime.swift
      - apps/macos/tests/bundled-runtime.test.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .node-version
      - helpers/denoise/provenance.json
      - scripts/release*
      - scripts/build-macos.mjs
      - scripts/launcher/**
      - scripts/launcher.test.mjs
      - scripts/sparkle/**
      - packages/core/src/catalog.ts
      - apps/macos/package.json
      - apps/macos/Sources/Yap/ServiceBundle.swift
      - apps/macos/Sources/Yap/NodeRuntime.swift
      - apps/macos/tests/bundled-runtime.test.mjs
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            apps/macos
            helpers/denoise
            scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: node --test scripts/release*.test.mjs scripts/launcher.test.mjs apps/macos/tests/bundled-runtime.test.mjs
